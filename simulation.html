<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simulation de l'interface SolarSound">
    <title>Simulation SolarSound</title>
    <link rel="icon" type="image/png" href="assets/images/logo.png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/simulation.css">
</head>
<body class="sim-body">
<!-- Scène fixe 1920x1020 (comme les captures), mise à l'échelle par le JS -->
<div class="stage" id="stage">

    <div class="titlebar">
        <img src="assets/images/logo.png" alt="" onerror="this.remove()">
        <span id="tbTitle">SolarSound</span>
        <div class="wc"><i>&#8211;</i><i>&#9633;</i><i>&#10005;</i></div>
    </div>

    <nav class="menu">
        <a href="#"><u>F</u>ichier</a><a href="#"><u>L</u>ecture</a><a href="#"><u>A</u>ffichage</a><a href="#"><u>À</u> propos</a>
        <div class="search"><img class="svg-icon" src="assets/images/icons/loupe.svg" alt="" onerror="this.remove()"><span>Rechercher pistes, albums, artistes, ...</span></div>
    </nav>

    <header class="head">
        <h1><b>SOLAR</b> SOUND</h1><small>LECTEUR 5.1</small>
        <span class="mode"><i id="modeDot"></i><em id="mode">ALÉATOIRE</em></span>
    </header>

    <section class="np">
        <div class="cover"><img class="svg-icon cov" src="assets/images/icons/defaultcover.svg" alt="" onerror="this.remove()"></div>
        <div class="np-t" id="npT">Aucun morceau</div>
        <div class="np-a" id="npA"></div>
        <canvas id="big" width="1130" height="115"></canvas>
        <div class="vol" id="vol"><span>VOL</span><div class="vtrack"><div class="vfill"></div><div class="vthumb"></div></div><em id="volP">6%</em></div>
        <span class="tc" id="tCur">0:00</span>
        <canvas id="seek" width="1755" height="52"></canvas>
        <span class="tc tt" id="tTot">0:00</span>
    </section>

    <section class="ctl">
        <div class="mini">
            <button id="bRep" title="Répéter"></button><button id="bShuf" title="Aléatoire"></button><button id="bFav" title="Coup de cœur"></button>
        </div>
        <button class="tb" id="bPrev"></button>
        <button class="tb" id="bStop"></button>
        <button class="tb big" id="bPlay"></button>
        <button class="tb" id="bNext"></button>
        <aside class="next">
            <div class="thumb"><img class="svg-icon cov" src="assets/images/icons/defaultcover.svg" alt="" onerror="this.remove()"></div>
            <div><small>Prochain :</small><b id="nxT">—</b><span id="nxA"></span></div>
        </aside>
    </section>

    <div class="tabs" id="tabs"></div>
    <main class="panel" id="panel"></main>
    <div class="status" id="status">Prêt</div>
    <div class="toast" id="toast"></div>
</div>
<script src="assets/js/simulation.js"></script>
</body>
</html>
